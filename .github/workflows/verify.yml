name: Verify local compatibility harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-steward-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run existing compatibility tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check public/app.js
      - name: Execute expand and backfill evidence gate
        run: python release_steward.py audit --scenario expand-contract --output artifacts/release-evidence.json --require-pass
      - name: Record actual GitHub run provenance separately
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          record = {
              'provider': 'GitHub Actions',
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'event': os.environ['GITHUB_EVENT_NAME'],
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'gitlabDuoVerified': False,
          }
          Path('artifacts/github-run.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Retain executed evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-steward-evidence
          path: |
            artifacts/release-evidence.json
            artifacts/github-run.json
          if-no-files-found: error
          retention-days: 60
